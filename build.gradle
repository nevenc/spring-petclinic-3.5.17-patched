plugins {
  id 'java'
  id 'jacoco'
  id 'org.springframework.boot' version '3.5.17'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'io.spring.javaformat' version '0.0.48'
  id 'io.spring.nohttp' version '0.0.11'
  id 'com.gorylenko.gradle-git-properties' version '2.4.2'
}

group = 'org.springframework.samples'
version = '3.5.17'
description = 'petclinic'

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
  options.encoding = 'UTF-8'
}

repositories {
  mavenCentral()
  // Spring Boot 3.5.17 is an enterprise (Tanzu Spring) release
  maven {
    name = 'springEnterpriseSubscription'
    url = 'https://packages.broadcom.com/artifactory/spring-enterprise/'
    credentials {
      username = findProperty('tanzuArtifactoryUser') ?: System.getenv('TANZU_ARTIFACTORY_USER')
      password = findProperty('tanzuArtifactoryToken') ?: System.getenv('TANZU_ARTIFACTORY_TOKEN')
    }
  }
}

ext.webjarsBootstrapVersion = '5.1.3'
ext.webjarsFontawesomeVersion = '4.7.0'
ext.jacocoVersion = '0.8.7'
ext.checkstyleVersion = '8.45.1'

// Overrides the version managed by Spring Boot, mirroring <postgresql.version> in pom.xml
ext['postgresql.version'] = '42.7.14'

// Version overrides, mirroring <dependencyManagement> in pom.xml
dependencyManagement {
    dependencies {
        dependency 'org.aspectj:aspectjweaver:1.9.27'
        dependency 'org.attoparser:attoparser:2.0.10.RELEASE'
        dependency 'org.hibernate.validator:hibernate-validator:8.0.6.Final'
        dependency 'org.jboss:jandex:2.4.5.Final'
        dependency 'org.unbescape:unbescape:1.1.8.RELEASE'
    }
    implementation {
        dependencies {
            dependency 'org.slf4j:slf4j-api:2.0.20'
            dependency 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.21.8'
            dependency 'org.apache.tomcat.embed:tomcat-embed-core:10.1.61'
            dependency 'com.fasterxml.jackson.core:jackson-core:2.21.8'
            dependency 'org.hibernate.orm:hibernate-core:6.6.59.Final'
            dependency 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.8'
            dependency 'org.apache.tomcat.embed:tomcat-embed-websocket:10.1.61'
            dependency 'org.slf4j:jul-to-slf4j:2.0.20'
            dependency 'org.thymeleaf:thymeleaf:3.1.6.RELEASE'
            dependency 'com.fasterxml.jackson.core:jackson-databind:2.21.8'
            dependency 'org.apache.tomcat.embed:tomcat-embed-el:10.1.61'
            dependency 'com.fasterxml.jackson.module:jackson-module-parameter-names:2.21.8'
            dependency 'org.thymeleaf:thymeleaf-spring6:3.1.6.RELEASE'
        }
    }
    nohttp {
        dependencies {
            dependency 'info.picocli:picocli:4.6.3'
            dependency 'com.google.guava:failureaccess:1.0.3'
        }
    }
    runtimeOnly {
        dependencies {
            dependency 'io.smallrye:jandex:3.2.7'
        }
    }
}

dependencies {
  implementation 'jakarta.xml.bind:jakarta.xml.bind-api'

  // Spring and Spring Boot dependencies
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-cache'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'

  // Databases - Uses H2 by default
  runtimeOnly 'com.h2database:h2'
  runtimeOnly 'com.mysql:mysql-connector-j'
  runtimeOnly 'org.postgresql:postgresql'

  // caching
  implementation('org.ehcache:ehcache') {
    artifact {
      classifier = 'jakarta'
    }
  }

  // webjars
  implementation "org.webjars.npm:bootstrap:${webjarsBootstrapVersion}"
  implementation "org.webjars.npm:font-awesome:${webjarsFontawesomeVersion}"

  developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

tasks.named('test') {
  useJUnitPlatform()
  finalizedBy 'jacocoTestReport'
}

// Spring Boot Actuator displays build-related information
// if a META-INF/build-info.properties file is present
springBoot {
  buildInfo {
    properties {
      additional = [
        'encoding.source'   : 'UTF-8',
        'encoding.reporting': 'UTF-8',
        'java.source'       : java.sourceCompatibility.toString(),
        'java.target'       : java.targetCompatibility.toString()
      ]
    }
  }
}

// Spring Boot Actuator displays git information if a git.properties
// file is present on the classpath
gitProperties {
  dateFormat = "yyyy-MM-dd'T'HH:mm:ssZ"
  failOnNoGitDirectory = false
}

jacoco {
  toolVersion = jacocoVersion
}

// Only the nohttp check is used, as in the Maven build
checkstyle {
  toolVersion = checkstyleVersion
  configDirectory = file('src/checkstyle')
  configFile = file('src/checkstyle/nohttp-checkstyle.xml')
}

tasks.named('checkstyleMain') { enabled = false }
tasks.named('checkstyleTest') { enabled = false }

// Mirrors the excludes in pom.xml and src/checkstyle/nohttp-checkstyle-suppressions.xml
nohttp {
  source.exclude 'target/**', 'bin/**', '.gradle/**', '.idea/**', '**/*.class',
    '**/node_modules/**', '**/node/**', '**/build.log',
    '**/*.jar', '**/*.git', '**/*.ico', '**/*.p12', '**/*.gif', '**/*.jks', '**/*.jpg', '**/*.svg'
}

checkstyleNohttp {
  configDirectory = file('src/checkstyle')
  configFile = file('src/checkstyle/nohttp-checkstyle.xml')
}
