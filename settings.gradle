pluginManagement {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    maven {
      name = 'springEnterpriseSubscription'
      url = 'https://packages.broadcom.com/artifactory/spring-enterprise/'
      credentials {
        username = providers.gradleProperty('tanzuArtifactoryUser').getOrElse(System.getenv('TANZU_ARTIFACTORY_USER') ?: '')
        password = providers.gradleProperty('tanzuArtifactoryToken').getOrElse(System.getenv('TANZU_ARTIFACTORY_TOKEN') ?: '')
      }
    }
  }
  resolutionStrategy {
    eachPlugin {
      // enterprise Spring Boot releases may not ship a Gradle plugin marker artifact
      if (requested.id.id == 'org.springframework.boot') {
        useModule("org.springframework.boot:spring-boot-gradle-plugin:${requested.version}")
      }
    }
  }
}

rootProject.name = 'spring-petclinic'
